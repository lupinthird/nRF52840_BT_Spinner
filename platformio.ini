; nRF52840 BLE HID controller — nice!nano V2
; Flash the env that matches each unit: spinner / paddle / combo × color.
; BLE names and DIS serial numbers: include/device_identity.h
; Pot end stops (paddle/combo): include/paddle_calibration.h or build_flags, e.g.
;   -DPOT_ADC_MIN=420 -DPOT_ADC_MAX=3680
; Use -DPOT_DEBUG=1 while sweeping to read raw ADC on serial (115200).

[platformio]
default_envs = spinner_red
src_dir = src
include_dir = include

[env]
platform = nordicnrf52
board = nicenano
board_build.variants_dir = boards
framework = arduino
lib_deps =
  https://github.com/adafruit/Adafruit_nRF52_Arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -DNRF52840_XXAA
  -DNICENANO
  -Wl,--section-start=.text=0x26000

[env:spinner_red]
build_flags =
  ${env.build_flags}
  -DDEVICE_VARIANT_ID=0

[env:spinner_blue]
build_flags =
  ${env.build_flags}
  -DDEVICE_VARIANT_ID=1

[env:spinner_green]
build_flags =
  ${env.build_flags}
  -DDEVICE_VARIANT_ID=2

[env:spinner_yellow]
build_flags =
  ${env.build_flags}
  -DDEVICE_VARIANT_ID=3

[env:paddle_red]
build_flags =
  ${env.build_flags}
  -DDEVICE_VARIANT_ID=4
  -DPOT_ADC_MIN=0
  -DPOT_ADC_MAX=3766

[env:paddle_blue]
build_flags =
  ${env.build_flags}
  -DDEVICE_VARIANT_ID=5

[env:paddle_green]
build_flags =
  ${env.build_flags}
  -DDEVICE_VARIANT_ID=6

[env:paddle_yellow]
build_flags =
  ${env.build_flags}
  -DDEVICE_VARIANT_ID=7

[env:combo_red]
build_flags =
  ${env.build_flags}
  -DDEVICE_VARIANT_ID=8

[env:combo_blue]
build_flags =
  ${env.build_flags}
  -DDEVICE_VARIANT_ID=9

[env:combo_green]
build_flags =
  ${env.build_flags}
  -DDEVICE_VARIANT_ID=10

[env:combo_yellow]
build_flags =
  ${env.build_flags}
  -DDEVICE_VARIANT_ID=11
