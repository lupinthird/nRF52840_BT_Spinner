; nRF52 BLE HID controller — nice!nano V2 (nRF52840) or Adafruit Feather (nRF52832)
; Flash the env that matches each unit: spinner / paddle / combo × color × board.
; BLE names and DIS serial numbers: include/device_identity.h
; Pot end stops (paddle/combo): include/paddle_calibration.h or build_flags, e.g.
;   -DPOT_ADC_MIN=420 -DPOT_ADC_MAX=3680
; Use -DPOT_DEBUG=1 while sweeping to read raw ADC on serial (115200).
;
; nice!nano (default):  spinner_red, paddle_blue, combo_green, ...
; Feather nRF52832:     feather_spinner_red, feather_paddle_blue, feather_combo_green, ...

[platformio]
default_envs = spinner_red
src_dir = src
include_dir = include

[env]
platform = nordicnrf52
framework = arduino
lib_deps =
  https://github.com/adafruit/Adafruit_nRF52_Arduino
monitor_speed = 115200
upload_speed = 115200

; --- nice!nano V2 (nRF52840, custom variant in boards/) -----------------------

[env:nicenano]
extends = env
board = nicenano
board_build.variants_dir = boards
build_flags =
  -DNRF52840_XXAA
  -DNICENANO
  -DBOARD_NICENANO=1
  -Wl,--section-start=.text=0x26000

[env:spinner_red]
extends = env:nicenano
build_flags =
  ${env:nicenano.build_flags}
  -DDEVICE_VARIANT_ID=0

[env:spinner_blue]
extends = env:nicenano
build_flags =
  ${env:nicenano.build_flags}
  -DDEVICE_VARIANT_ID=1

[env:spinner_green]
extends = env:nicenano
build_flags =
  ${env:nicenano.build_flags}
  -DDEVICE_VARIANT_ID=2

[env:spinner_yellow]
extends = env:nicenano
build_flags =
  ${env:nicenano.build_flags}
  -DDEVICE_VARIANT_ID=3

[env:paddle_red]
extends = env:nicenano
build_flags =
  ${env:nicenano.build_flags}
  -DDEVICE_VARIANT_ID=4
  -DPOT_ADC_MIN=0
  -DPOT_ADC_MAX=3766

[env:paddle_blue]
extends = env:nicenano
build_flags =
  ${env:nicenano.build_flags}
  -DDEVICE_VARIANT_ID=5

[env:paddle_green]
extends = env:nicenano
build_flags =
  ${env:nicenano.build_flags}
  -DDEVICE_VARIANT_ID=6

[env:paddle_yellow]
extends = env:nicenano
build_flags =
  ${env:nicenano.build_flags}
  -DDEVICE_VARIANT_ID=7

[env:combo_red]
extends = env:nicenano
build_flags =
  ${env:nicenano.build_flags}
  -DDEVICE_VARIANT_ID=8

[env:combo_blue]
extends = env:nicenano
build_flags =
  ${env:nicenano.build_flags}
  -DDEVICE_VARIANT_ID=9

[env:combo_green]
extends = env:nicenano
build_flags =
  ${env:nicenano.build_flags}
  -DDEVICE_VARIANT_ID=10

[env:combo_yellow]
extends = env:nicenano
build_flags =
  ${env:nicenano.build_flags}
  -DDEVICE_VARIANT_ID=11

; --- Adafruit Feather nRF52832 (S132, built-in feather_nrf52832 variant) ------

[env:feather_nrf52832]
extends = env
board = adafruit_feather_nrf52832
build_flags =
  -DNRF52832_XXAA
  -DARDUINO_FEATHER_NRF52832
  -DBOARD_FEATHER_NRF52832=1

[env:feather_spinner_red]
